<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Referrals admin console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-lite.js" defer></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="dc-template">
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B1C8A}a:hover{color:#35106A}
input,select,button,textarea{font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #4B1C8A;outline-offset:2px}
button,.card,.tr,.pill,.inp,.ta,.tab{transition:background-color .18s ease,border-color .18s ease,box-shadow .2s ease,transform .15s ease,color .18s ease,filter .15s ease}
button:not(:disabled):hover{filter:brightness(.97)}
.btn:not(:disabled):hover{border-color:#B9A3DE;color:#35106A}
.btnp:not(:disabled):hover{filter:none;background:#35106A;box-shadow:0 4px 14px rgba(75,28,138,.30);transform:translateY(-1px)}
.btnd:not(:disabled):hover{border-color:#D97757;box-shadow:0 2px 8px rgba(180,35,24,.12)}
button:not(:disabled):active{transform:translateY(0) scale(.97)}
.inp:hover,.ta:hover{border-color:#B9A3DE}
.inp:focus,.ta:focus{border-color:#4B1C8A;box-shadow:0 0 0 3px rgba(75,28,138,.14);outline:none}
.tr:hover{box-shadow:inset 3px 0 0 #4B1C8A}
.tab:hover{color:#4B1C8A !important}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
button.card:hover,.lift:hover{box-shadow:0 8px 22px rgba(75,28,138,.13);transform:translateY(-2px);border-color:#D8C9EF}
.bar>div,.bar>span{transform-origin:left center;animation:barGrow .9s cubic-bezier(.2,.8,.2,1) both}
.ovl{animation:fadeIn .18s ease both}
[role=dialog]{animation:popIn .24s cubic-bezier(.2,.8,.2,1) both}
[role=status]{animation:slideDown .28s cubic-bezier(.2,.8,.2,1) both}
[role=menu]{animation:slideDown .16s ease both}
.pill{animation:fadeIn .3s ease both}
.cp:active{transform:scale(.9)}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.demo{position:relative;outline:2px dashed #B7791F !important;outline-offset:3px;border-radius:8px}
.demo::after{content:'DEMO ONLY';position:absolute;top:-11px;right:8px;font:700 9px/1.5 Inter,sans-serif;letter-spacing:.08em;background:#B7791F;color:#FFFFFF;padding:0 6px;border-radius:4px;pointer-events:none;z-index:3;white-space:nowrap}
.demo-in{outline-offset:-4px}
.demo-in::after{top:4px}
.vsw{display:inline-flex;gap:2px;padding:3px;background:#2A2F3A;border-radius:10px}
.vsw a,.vsw span{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;text-decoration:none;color:#C9CFDA;white-space:nowrap}
.vsw a:hover{background:#3A4050;color:#FFFFFF}
.vsw .on{background:#FFFFFF;color:#14171F}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

button:disabled{opacity:.45;cursor:not-allowed}
.card{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;padding:18px;box-sizing:border-box;min-width:0}
.btn{min-height:36px;padding:0 12px;border:1px solid #C9CED6;border-radius:8px;background:#FFFFFF;color:#14171F;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btnp{min-height:36px;padding:0 14px;border:1px solid #4B1C8A;border-radius:8px;background:#4B1C8A;color:#FFFFFF;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btnd{min-height:36px;padding:0 12px;border:1px solid #E8B4A0;border-radius:8px;background:#FFFFFF;color:#9A3412;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.lnk{background:transparent;border:0;padding:0;color:#4B1C8A;cursor:pointer;font-weight:500;text-align:left;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.inp{min-height:36px;padding:0 10px;border:1px solid #C9CED6;border-radius:8px;background:#FFFFFF;font-size:13px;color:#14171F;box-sizing:border-box;min-width:0}
.ta{padding:10px;border:1px solid #C9CED6;border-radius:8px;font-size:12px;min-height:120px;resize:vertical;box-sizing:border-box;width:100%;font-family:ui-monospace,Menlo,monospace}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#3D4452}
.th{font-size:12px;font-weight:600;color:#3D4452;padding:10px 8px;background:#F7F8FA;border-bottom:1px solid #E3E6EB;align-items:center}
.tr{padding:8px;border-bottom:1px solid #EEF0F3;align-items:center;font-size:13px}
.muted{color:#5B6372;font-size:12px}
.h1{margin:0;font-family:Inter,sans-serif;letter-spacing:-0.01em;font-size:26px;font-weight:600}
.h2{margin:0;font-size:15px;font-weight:600}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tab{min-height:44px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-size:13px;white-space:nowrap}
.tgl{width:40px;height:24px;border-radius:999px;border:0;padding:2px;cursor:pointer;display:inline-flex;flex:none}
.knob{width:20px;height:20px;border-radius:50%;background:#FFFFFF;display:block;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.bar{background:#EEF0F3;border-radius:999px;height:8px;overflow:hidden}
.cb{width:18px;height:18px;cursor:pointer;accent-color:#4B1C8A}
.cp{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border:1px solid transparent;border-radius:6px;background:transparent;color:#5B6372;cursor:pointer;padding:0;vertical-align:middle}.cp:hover{background:#EEF0F3;border-color:#C9CED6;color:#14171F}
.cpw{display:inline-flex;align-items:center;gap:2px;min-width:0;max-width:100%}
.mscroll{scrollbar-width:thin;scrollbar-color:#C9CED6 transparent}.mscroll::-webkit-scrollbar{width:6px}.mscroll::-webkit-scrollbar-track{background:transparent}.mscroll::-webkit-scrollbar-thumb{background:#C9CED6;border-radius:999px}
.note{background:#FFFBEB;border:1px solid #F3D98B;border-radius:10px;padding:10px 12px;font-size:13px;color:#5B4410}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F5F8; font-family: Inter, system-ui, sans-serif; color: #14171F; font-size: 14px; line-height: 1.45; display: flex; flex-wrap: wrap; align-items: stretch; align-content: flex-start">

<div class="demo demo-in" style="flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 8px 16px; background: #14171F; border-radius: 0"><span style="font-size: 12px; color: #B8BFCC">Prototype view</span><nav class="vsw" aria-label="Prototype view"><span class="on" aria-current="page">Admin</span><a href="Portal.dc.html">Member</a></nav></div>

<nav aria-label="Admin" style="flex: 1 1 210px; max-width: 100%; min-height: calc(100vh - 46px); background: #2B0D57; color: #D5DAE3; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px"><svg width="34" height="25" viewBox="0 0 30 22" aria-label="Edge" role="img"><g fill="#FFFFFF"><circle cx="4" cy="4" r="3.2"></circle><circle cx="12" cy="4" r="3.2"></circle><rect x="17" y="1" width="12" height="6" rx="3"></rect><circle cx="4" cy="11" r="3.2"></circle><rect x="9" y="8" width="12" height="6" rx="3"></rect><circle cx="4" cy="18" r="3.2"></circle><circle cx="12" cy="18" r="3.2"></circle><rect x="17" y="15" width="12" height="6" rx="3"></rect></g></svg><div><div style="font-weight: 700; color: #FFFFFF; font-size: 15px; letter-spacing: -0.01em">Edge Referrals</div><div style="font-size: 11px; color: #9AA3B2">Admin · in Radius</div></div></div>
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="9">
<button onClick="{{n.pick}}" style="min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.fw}}">
<span>{{n.label}}</span>
</button>
</sc-for>
<div style="margin-top: 16px; padding: 0 12px; font-size: 11px; color: #9AA3B2; text-transform: uppercase; letter-spacing: 0.06em">Recently viewed</div>
<sc-for list="{{recentViews}}" as="r" hint-placeholder-count="3"><button onClick="{{r.open}}" style="min-height: 32px; padding: 0 12px; border: 0; background: transparent; color: #D5DAE3; text-align: left; cursor: pointer; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.label}}</button></sc-for>
<div style="margin-top: auto; padding: 16px 12px 4px; font-size: 11px; color: #C9B8E8; line-height: 1.45"><span style="display: inline-block; width: 22px; height: 0; border-top: 2px dashed #E0B04A; vertical-align: middle; margin-right: 6px"></span>Dashed amber outline = demo-only control, not part of the final product</div>
</nav>

<div style="flex: 999 1 720px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 24px; background: #FFFFFF; border-bottom: 1px solid #E3E6EB; position: relative">
<div style="flex: 1 1 320px; position: relative; max-width: 560px">
<label style="display: flex; align-items: center; gap: 8px; border: 1px solid #C9CED6; border-radius: 999px; padding: 0 14px; min-height: 40px; background: #FFFFFF">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6372" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input value="{{q}}" onChange="{{setQ}}" onKeyDown="{{searchKey}}" aria-label="Search members and referrals by name or email" placeholder="Search members and referrals by name or email" style="flex: 1; min-width: 0; border: 0; min-height: 38px; font-size: 13px; background: transparent"></label>
<sc-if value="{{searchOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; right: 0; top: 46px; z-index: 30; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; box-shadow: 0 12px 32px rgba(20,23,31,.16); padding: 8px; max-height: 420px; overflow: auto">
<sc-for list="{{searchGroups}}" as="g" hint-placeholder-count="2">
<div style="padding: 6px 8px 2px" class="muted">{{g.label}}</div>
<sc-for list="{{g.items}}" as="x" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 4px">
<button onClick="{{x.open}}" style="flex: 1; min-width: 0; text-align: left; display: flex; gap: 10px; align-items: center; padding: 8px; border: 0; border-radius: 8px; background: #FFFFFF; cursor: pointer">
<span style="width: 30px; height: 30px; border-radius: 50%; background: #ECE4F7; color: #4B1C8A; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none">{{x.ini}}</span>
<span style="min-width: 0"><span style="font-weight: 500">{{x.title}}</span> <span class="pill" style="background: {{x.bg}}; color: {{x.fg}}">{{x.status}}</span><br><span class="muted">{{x.sub}}</span></span>
</button><button class="cp" onClick="{{x.copyName}}" aria-label="Copy name" title="Copy name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button><button class="cp" onClick="{{x.copyEmail}}" aria-label="Copy email" title="Copy email"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
</div>
</sc-for>
</sc-for>
<sc-if value="{{noSearch}}" hint-placeholder-val="{{false}}"><div class="muted" style="padding: 10px">No members or referrals match “{{q}}” in your regions.</div></sc-if>
<sc-if value="{{hasSearch}}" hint-placeholder-val="{{true}}"><button onClick="{{searchAll}}" style="width: 100%; margin-top: 4px; padding: 10px 8px; border: 0; border-top: 1px solid #EEF0F3; background: #FFFFFF; color: #4B1C8A; font-weight: 600; cursor: pointer; text-align: left; font-size: 13px">See all {{searchTotal}} results <span class="muted" style="font-weight: 400">· or press Enter</span></button></sc-if>
</div>
</sc-if>
</div>
<label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5B6372">Region
<select class="inp" value="{{region}}" onChange="{{setRegion}}" disabled="{{regionLocked}}"><option value="ALL">All regions</option><option value="PK">Pakistan</option><option value="PE">Peru</option><option value="GL">Global</option></select></label>
<div class="demo" style="display: flex; align-items: center; gap: 6px; border: 1px solid #F3D98B; background: #FFFBEB; border-radius: 8px; padding: 3px 3px 3px 10px; font-size: 12px; color: #5B4410">Demo date <strong style="color: #14171F">{{clock}}</strong>
<button class="btn" onClick="{{addWeek}}" style="min-height: 28px; padding: 0 8px; font-size: 12px">+1 wk</button><button class="btn" onClick="{{addMonth}}" style="min-height: 28px; padding: 0 8px; font-size: 12px">+1 mo</button></div>
<div style="position: relative">
<button class="btnp" onClick="{{toggleActions}}" aria-expanded="{{actionsOpenStr}}">+ Actions</button>
<sc-if value="{{actionsOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 0; top: 42px; z-index: 30; width: 260px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; box-shadow: 0 12px 32px rgba(20,23,31,.16); padding: 6px">
<sc-for list="{{actionMenu}}" as="a" hint-placeholder-count="5"><button onClick="{{a.go}}" style="width: 100%; text-align: left; padding: 10px; border: 0; border-radius: 8px; background: #FFFFFF; cursor: pointer"><div style="font-weight: 500; font-size: 13px">{{a.label}}</div><div class="muted">{{a.sub}}</div></button></sc-for>
</div>
</sc-if>
</div>
<button onClick="{{goHome}}" aria-label="Open action items" style="position: relative; width: 40px; height: 40px; border: 1px solid #E3E6EB; border-radius: 50%; background: #FFFFFF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4452" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
<sc-if value="{{bellCount}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 999px; background: #B42318; color: #FFFFFF; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px">{{bellCount}}</span></sc-if>
</button>
<label class="demo" title="Demo: switch between roles to see permissions" style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5B6372; padding: 2px 4px"><span style="width: 32px; height: 32px; border-radius: 50%; background: #3D4452; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">{{userIni}}</span>
<select class="inp" value="{{user}}" onChange="{{setUser}}" aria-label="Signed in as"><option value="admin">Mehwish · Super admin</option><option value="pe">Carlos · Region admin (Peru)</option><option value="finance">Finance · Payout approver</option></select></label>
</header>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="margin: 12px 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #14171F; color: #FFFFFF; border-radius: 10px; padding: 8px 8px 8px 16px; font-size: 13px"><span>{{toast}}</span><button onClick="{{clearToast}}" aria-label="Dismiss" style="background: transparent; color: #FFFFFF; border: 0; cursor: pointer; min-height: 32px; padding: 0 10px">✕</button></div>
</sc-if>

<main style="padding: 20px 24px 64px; display: flex; flex-direction: column; gap: 18px; min-width: 0">

<sc-if value="{{v.home}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div><h1 class="h1">{{greeting}}</h1><div class="muted">{{regionLabel}} · {{openCount}} things need you today</div></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button class="btn" onClick="{{goImport}}">Bulk import</button><button class="btn" onClick="{{goPayments}}">Payouts</button><button class="btn" onClick="{{exportAll}}">Export referrals</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{regionCards}}" as="r" hint-placeholder-count="3">
<button onClick="{{r.pick}}" class="card" style="text-align: left; cursor: pointer; padding: 14px 16px; border-color: {{r.bd}}">
<div style="display: flex; justify-content: space-between"><span style="font-weight: 600">{{r.name}}</span><span class="muted">{{r.cur}}</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px"><div><div style="font-size: 20px; font-weight: 600">{{r.pending}}</div><div class="muted">pending</div></div><div><div style="font-size: 20px; font-weight: 600">{{r.metering}}</div><div class="muted">qualifying</div></div><div><div style="font-size: 20px; font-weight: 600">{{r.due}}</div><div class="muted">to pay</div></div></div>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; align-items: start">
<sc-for list="{{queues}}" as="qq" hint-placeholder-count="6">
<section class="card" style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px"><h2 class="h2">{{qq.title}} <span class="pill" style="background: {{qq.bg}}; color: {{qq.fg}}">{{qq.count}}</span></h2><button class="lnk" onClick="{{qq.all}}">{{qq.allLabel}}</button></div>
<div class="muted" style="margin-bottom: 4px">{{qq.sub}}</div>
<sc-for list="{{qq.items}}" as="i" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid #EEF0F3">
<div style="display: flex; justify-content: space-between; gap: 10px; align-items: center">
<span style="min-width: 0"><button class="lnk" onClick="{{i.open}}">{{i.title}}</button><br><span class="muted">{{i.sub}}</span></span>
<span style="display: flex; gap: 6px; flex: none"><sc-if value="{{i.a1}}" hint-placeholder-val="{{true}}"><button class="btnp" onClick="{{i.do1}}" style="min-height: 32px">{{i.a1}}</button></sc-if><sc-if value="{{i.a2}}" hint-placeholder-val="{{false}}"><button class="btnd" onClick="{{i.do2}}" style="min-height: 32px">{{i.a2}}</button></sc-if></span>
</div>
<sc-if value="{{i.meter}}" hint-placeholder-val="{{false}}"><div class="bar"><div style="height: 8px; background: #4B1C8A; width: {{i.meter}}"></div></div></sc-if>
</div>
</sc-for>
<sc-if value="{{qq.empty}}" hint-placeholder-val="{{false}}"><div class="muted" style="padding: 10px 0; border-top: 1px solid #EEF0F3">{{qq.empty}}</div></sc-if>
</section>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{v.search}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap"><h1 class="h1">Search results</h1><span style="font-size: 18px; color: #5B6372">“{{sr.q}}” · {{sr.total}} results in {{regionLabel}}</span></div>
<sc-for list="{{sr.sections}}" as="g" hint-placeholder-count="2">
<section class="card" style="padding: 0; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #E3E6EB"><h2 class="h2">{{g.title}} ({{g.n}})</h2><button class="lnk" onClick="{{g.all}}">Open in {{g.title}} list</button></div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div class="tr" style="display: grid; grid-template-columns: 1.6fr 2fr 1.4fr 0.9fr; gap: 10px; padding: 10px 16px">
<span class="cpw"><button class="lnk" onClick="{{r.open}}">{{r.name}}</button></span><span class="muted" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.email}}</span><span class="muted">{{r.sub}}</span><span><span class="pill" style="background: {{r.bg}}; color: {{r.fg}}">{{r.status}}</span></span>
</div>
</sc-for>
</section>
</sc-for>
<sc-if value="{{sr.none}}" hint-placeholder-val="{{false}}"><div class="card muted">Nothing matches “{{sr.q}}”. Try part of the name or the full email address.</div></sc-if>
</div>
</sc-if>

<sc-if value="{{v.members}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 10px"><h1 class="h1">Members</h1><span style="font-size: 20px; color: #5B6372">{{memCount}} results</span></div>
<section class="card" style="padding: 0; overflow: hidden">
<div role="tablist" style="display: flex; overflow-x: auto; border-bottom: 1px solid #E3E6EB"><sc-for list="{{memTabs}}" as="t" hint-placeholder-count="6"><button class="tab" onClick="{{t.pick}}" style="color: {{t.fg}}; font-weight: {{t.fw}}; border-bottom-color: {{t.bd}}">{{t.label}}</button></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px">
<input class="inp" value="{{mq}}" onChange="{{setMq}}" placeholder="Filter this list" aria-label="Filter members" style="width: 240px">
<select class="inp" value="{{mProg}}" onChange="{{setMProg}}" aria-label="Program"><option value="ALL">All programs</option><option value="T-PE">Talent Referral – PE</option><option value="T-PK">Talent Referral – PK</option><option value="T-INT">Internal Edge</option><option value="C-GL">Customer Referral</option></select>
<span style="flex: 1"></span><button class="btn" onClick="{{exportMembers}}">Export</button><button class="btn" onClick="{{goImport}}">Import</button>
</div>
<sc-if value="{{selMCount}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: #ECE4F7; border-top: 1px solid #D8C9EF; border-bottom: 1px solid #D8C9EF">
<strong style="font-size: 13px">{{selMCount}} selected</strong>
<button class="btn" onClick="{{bulkActivate}}">Activate</button><button class="btn" onClick="{{bulkInvite}}">Send invite</button><button class="btnd" onClick="{{bulkDisable}}">Disable</button><button class="btn" onClick="{{exportSelM}}">Export selected</button><button class="lnk" onClick="{{clearSelM}}">Clear</button>
</div>
</sc-if>
<div style="overflow-x: auto"><div style="min-width: 900px">
<div class="th" style="display: grid; grid-template-columns: 36px 1.5fr 1.2fr 1fr 1.8fr 0.8fr 0.8fr 0.9fr 0.6fr 0.6fr; gap: 8px"><input type="checkbox" class="cb" checked="{{allM}}" onChange="{{toggleAllM}}" aria-label="Select all"><span>Name</span><span>Program</span><span>Referral code</span><span>Email</span><span>Created</span><span>Last share</span><span>Status</span><span>Paid</span><span>Referrals</span></div>
<sc-for list="{{memberRows}}" as="m" hint-placeholder-count="6">
<div class="tr" style="display: grid; grid-template-columns: 36px 1.5fr 1.2fr 1fr 1.8fr 0.8fr 0.8fr 0.9fr 0.6fr 0.6fr; gap: 8px; background: {{m.rowBg}}">
<input type="checkbox" class="cb" checked="{{m.checked}}" onChange="{{m.toggle}}" aria-label="Select {{m.name}}">
<span class="cpw"><button class="lnk" onClick="{{m.open}}">{{m.name}}</button><button class="cp" onClick="{{m.copyName}}" aria-label="Copy name" title="Copy name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button></span><span>{{m.prog}}</span><span class="mono">{{m.code}}</span><span class="cpw"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap" title="{{m.email}}">{{m.email}}</span><button class="cp" onClick="{{m.copyEmail}}" aria-label="Copy email" title="Copy email"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button></span><span>{{m.created}}</span><span>{{m.lastShare}}</span><span><span class="pill" style="background: {{m.bg}}; color: {{m.fg}}">{{m.status}}</span></span><span>{{m.paid}}</span><span>{{m.refs}}</span>
</div>
</sc-for>
<sc-if value="{{noMembers}}" hint-placeholder-val="{{false}}"><div class="muted" style="padding: 20px">No members match.</div></sc-if>
</div></div>
</section>
</div>
</sc-if>

<sc-if value="{{v.referrals}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px"><div style="display: flex; align-items: baseline; gap: 10px"><h1 class="h1">Referrals</h1><span style="font-size: 20px; color: #5B6372">{{refCount}} results</span></div></div>

<section class="card" style="padding: 0; overflow: hidden">
<div role="tablist" style="display: flex; overflow-x: auto; border-bottom: 1px solid #E3E6EB"><sc-for list="{{refTabs}}" as="t" hint-placeholder-count="6"><button class="tab" onClick="{{t.pick}}" style="color: {{t.fg}}; font-weight: {{t.fw}}; border-bottom-color: {{t.bd}}">{{t.label}}</button></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px">
<input class="inp" value="{{rq}}" onChange="{{setRq}}" placeholder="Filter by name, email, ID" aria-label="Filter referrals" style="width: 240px">
<div role="group" aria-label="Type" style="display: flex; gap: 4px"><sc-for list="{{kindSeg}}" as="k" hint-placeholder-count="3"><button class="btn" onClick="{{k.pick}}" style="min-height: 34px; background: {{k.bg}}; color: {{k.fg}}; border-color: {{k.bd}}">{{k.label}}</button></sc-for></div>
<span style="flex: 1"></span><button class="btn" onClick="{{exportRefs}}">Export</button><button class="btn" onClick="{{goImport}}">Import</button>
</div>
<sc-if value="{{selRCount}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; background: #ECE4F7; border-top: 1px solid #D8C9EF; border-bottom: 1px solid #D8C9EF">
<strong style="font-size: 13px">{{selRCount}} selected</strong>
<label style="display: flex; align-items: center; gap: 6px; font-size: 13px">Set status<select class="inp" value="{{bulk.status}}" onChange="{{setBulkStatus}}"><option value="Approved">Approved</option><option value="Qualifying">Qualifying</option><option value="Pending">Pending</option><option value="Denied">Denied</option></select></label>
<sc-if value="{{bulkIsApproved}}" hint-placeholder-val="{{true}}"><span style="display: flex; align-items: center; gap: 6px; font-size: 13px"><button class="tgl" aria-pressed="{{bulkPay.pressed}}" aria-label="Trigger payout" onClick="{{bulkPay.flip}}" style="background: {{bulkPay.bg}}"><span class="knob" style="margin-left: {{bulkPay.ml}}"></span></button>{{bulkPayLabel}}</span></sc-if>
<input class="inp" value="{{bulk.reason}}" onChange="{{setBulkReason}}" placeholder="Reason (15+ characters, goes to audit log)" aria-label="Reason" style="flex: 1 1 220px">
<button class="btnp" onClick="{{applyBulk}}">Review change…</button><button class="btn" onClick="{{exportSelR}}">Export selected</button><button class="lnk" onClick="{{clearSelR}}">Clear</button>
</div>
</sc-if>
<sc-if value="{{bulkConfirmOpen}}" hint-placeholder-val="{{false}}">
<div style="padding: 12px; background: #FFF7ED; border-bottom: 1px solid #F5C9A8; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
<strong>{{bulkSummary}}</strong>
<sc-for list="{{bulkEffects}}" as="e" hint-placeholder-count="3"><div style="display: flex; gap: 8px"><span aria-hidden="true">•</span><span>{{e}}</span></div></sc-for>
<div class="muted" style="font-size: 12px">Affected: {{bulkNames}}</div>
<sc-if value="{{bulkNeedAck}}" hint-placeholder-val="{{false}}"><label style="display: flex; gap: 8px; align-items: flex-start; cursor: pointer"><input type="checkbox" class="cb" checked="{{bulk.ack}}" onChange="{{flipBulkAck}}"><span>I understand {{bulkEarly}} of these have not completed 3 consecutive months and this overrides the program rule.</span></label></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: end"><label class="lbl">Type <span class="mono">{{bulkPhrase}}</span> to confirm<input class="inp mono" value="{{bulk.confirm}}" onChange="{{setBulkConfirm}}" autocomplete="off" style="width: 200px"></label><button class="btnp" onClick="{{confirmBulk}}" disabled="{{bulkCantConfirm}}">Confirm change</button><button class="btn" onClick="{{cancelBulk}}">Back</button></div>
</div>
</sc-if>

<div style="overflow-x: auto"><div style="min-width: 960px">
<div class="th" style="display: grid; grid-template-columns: 36px 1.6fr 0.8fr 1.3fr 1.2fr 0.9fr 1.6fr 0.9fr; gap: 8px"><input type="checkbox" class="cb" checked="{{allR}}" onChange="{{toggleAllR}}" aria-label="Select all"><span>Referral</span><span>Type</span><span>Referred by</span><span>Stage</span><span>Status</span><span>Approval meter</span><span>Payment</span></div>
<sc-for list="{{refRows}}" as="r" hint-placeholder-count="8">
<div class="tr" style="display: grid; grid-template-columns: 36px 1.6fr 0.8fr 1.3fr 1.2fr 0.9fr 1.6fr 0.9fr; gap: 8px; background: {{r.rowBg}}">
<input type="checkbox" class="cb" checked="{{r.checked}}" onChange="{{r.toggle}}" aria-label="Select {{r.name}}">
<span style="min-width: 0"><span class="cpw"><button class="lnk" onClick="{{r.open}}">{{r.name}}</button><button class="cp" onClick="{{r.copyName}}" aria-label="Copy name" title="Copy name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button><sc-if value="{{r.flag}}" hint-placeholder-val="{{false}}"><span class="pill" style="background: #FCE7DE; color: #9A3412">Flag</span></sc-if></span><br><span class="cpw"><span class="muted" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.email}}</span><button class="cp" onClick="{{r.copyEmail}}" aria-label="Copy email" title="Copy email"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button></span></span>
<span class="muted">{{r.kind}}</span><span>{{r.member}}</span><span class="muted">{{r.stage}}</span><span><span class="pill" style="background: {{r.bg}}; color: {{r.fg}}">{{r.status}}</span></span>
<span><sc-if value="{{r.hasMeter}}" hint-placeholder-val="{{true}}"><span style="display: flex; flex-direction: column; gap: 3px"><span class="bar"><span style="display: block; height: 8px; background: {{r.mColor}}; width: {{r.mW}}"></span></span><span class="muted">{{r.mText}}</span></span></sc-if><sc-if value="{{r.noMeter}}" hint-placeholder-val="{{false}}"><span class="muted">{{r.mText}}</span></sc-if></span>
<span class="muted">{{r.pay}}</span>
</div>
</sc-for>
<sc-if value="{{noRefs}}" hint-placeholder-val="{{false}}"><div class="muted" style="padding: 20px">No referrals match.</div></sc-if>
</div></div>
</section>
</div>
</sc-if>

<sc-if value="{{v.payments}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div><h1 class="h1">Payouts</h1><div class="muted">{{regionLabel}} · a referral is paid once, in the month after it is approved. At release each payment is re-checked, and whoever prepares a batch cannot release it.</div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start">
<section class="card" style="display: flex; flex-direction: column; gap: 10px">
<h2 class="h2">{{monthLabel}} payout</h2>
<div style="font-family: Inter, sans-serif; letter-spacing: -0.01em; font-size: 26px; font-weight: 600">{{dueTotal}}</div>
<div class="muted">{{dueText}}</div>
<sc-if value="{{missingAmt}}" hint-placeholder-val="{{false}}"><div class="note">{{missingAmt}} <button class="lnk" onClick="{{goPrograms}}">Set amounts</button></div></sc-if>
<div><button class="btnp" onClick="{{prepareBatch}}" disabled="{{cantPrepare}}">Prepare batch for approval</button></div>
</section>
<section class="card" style="display: flex; flex-direction: column; gap: 8px">
<h2 class="h2">Batches</h2>
<sc-for list="{{batches}}" as="b" hint-placeholder-count="1">
<div style="display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #EEF0F3; flex-wrap: wrap"><span><strong>{{b.id}}</strong> · {{b.items}} payments · {{b.total}}<br><span class="muted">Prepared by {{b.by}}{{b.result}}</span></span><span style="display: flex; gap: 8px; align-items: center"><span class="pill" style="background: {{b.bg}}; color: {{b.fg}}">{{b.status}}</span><sc-if value="{{b.awaiting}}" hint-placeholder-val="{{false}}"><button class="btnp" onClick="{{b.release}}">Approve &amp; release</button></sc-if></span></div>
</sc-for>
<sc-if value="{{noBatches}}" hint-placeholder-val="{{true}}"><div class="muted">No batches yet.</div></sc-if>
</section>
</div>
<section class="card" style="padding: 0; overflow: hidden">
<div role="tablist" style="display: flex; overflow-x: auto; border-bottom: 1px solid #E3E6EB"><sc-for list="{{payTabs}}" as="t" hint-placeholder-count="4"><button class="tab" onClick="{{t.pick}}" style="color: {{t.fg}}; font-weight: {{t.fw}}; border-bottom-color: {{t.bd}}">{{t.label}}</button></sc-for></div>
<div style="overflow-x: auto"><div style="min-width: 820px">
<div class="th" style="display: grid; grid-template-columns: 0.6fr 1.4fr 1.4fr 0.9fr 0.9fr 0.9fr 1.6fr; gap: 8px"><span>ID</span><span>Paid to</span><span>For referral</span><span>Amount</span><span>Payout</span><span>Status</span><span></span></div>
<sc-for list="{{payRows}}" as="w" hint-placeholder-count="5">
<div class="tr" style="display: grid; grid-template-columns: 0.6fr 1.4fr 1.4fr 0.9fr 0.9fr 0.9fr 1.6fr; gap: 8px">
<span class="mono">{{w.id}}</span><button class="lnk" onClick="{{w.openM}}">{{w.member}}</button><button class="lnk" onClick="{{w.openR}}">{{w.ref}}</button><span style="font-weight: 600">{{w.amount}}</span><span>{{w.month}}</span><span><span class="pill" style="background: {{w.bg}}; color: {{w.fg}}">{{w.status}}</span></span>
<span style="display: flex; gap: 6px; align-items: center"><span class="muted">{{w.note}}</span><sc-if value="{{w.canHold}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{w.startHold}}" style="min-height: 30px">Hold…</button></sc-if><sc-if value="{{w.canResume}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{w.resume}}" style="min-height: 30px">Release hold</button></sc-if></span>
</div>
<sc-if value="{{w.holding}}" hint-placeholder-val="{{false}}">
<div style="margin: 0 12px 12px; padding: 14px; background: #FFF7ED; border: 1px solid #F5C9A8; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
<strong>Hold {{w.id}}: {{w.amount}} to {{w.member}}</strong>
<span class="muted" style="font-size: 12px">A held payment is skipped by every payout batch until someone releases it. {{w.member}} will see it as delayed.</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<label class="lbl">Reason<select class="inp" value="{{hold.reason}}" onChange="{{setHoldReason}}"><option value="">Choose a reason…</option><option value="Open dispute or Assist ticket">Open dispute or Assist ticket</option><option value="Fraud review">Fraud review</option><option value="Engagement status being verified">Engagement status being verified</option><option value="Referrer status being verified">Referrer status being verified</option><option value="Other">Other</option></select></label>
<label class="lbl">Details (15+ characters)<input class="inp" value="{{hold.note}}" onChange="{{setHoldNote}}" placeholder="What is being checked and by whom"></label>
<label class="lbl">Type <span class="mono">{{w.id}}</span> to confirm<input class="inp mono" value="{{hold.confirm}}" onChange="{{setHoldConfirm}}" autocomplete="off"></label>
</div>
<sc-if value="{{holdErr}}" hint-placeholder-val="{{false}}"><div style="color: #9A3412; font-size: 12px">{{holdErr}}</div></sc-if>
<div style="display: flex; gap: 8px"><button class="btnd" onClick="{{w.hold}}" disabled="{{w.cantHold}}">Confirm hold</button><button class="btn" onClick="{{cancelHold}}">Cancel</button></div>
</div>
</sc-if>
</sc-for>
<sc-if value="{{noPay}}" hint-placeholder-val="{{false}}"><div class="muted" style="padding: 20px">Nothing here.</div></sc-if>
</div></div>
</section>
</div>
</sc-if>

<sc-if value="{{v.import}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div><h1 class="h1">Bulk import</h1><div class="muted">Pick what you want to do, upload a CSV, choose the header row, map the columns and review every row before anything changes.</div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px">
<sc-for list="{{impGroups}}" as="g" hint-placeholder-count="3">
<section class="card" style="display: flex; flex-direction: column; gap: 10px">
<div><div style="font-weight: 600; font-size: 15px">{{g.title}}</div><div class="muted" style="font-size: 13px; margin-top: 2px">{{g.desc}}</div></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{g.actions}}" as="a" hint-placeholder-count="2"><button class="btn" onClick="{{a.start}}" style="color: #4B1C8A; border-color: #D8C9EF; background: #F8F4FD">{{a.label}}</button></sc-for>
</div>
</section>
</sc-for>
</div>
<section class="card" style="padding: 0; overflow: hidden">
<div style="padding: 12px 16px; border-bottom: 1px solid #E3E6EB"><h2 class="h2">Import history</h2></div>
<sc-for list="{{impHistory}}" as="h" hint-placeholder-count="2"><div class="tr" style="display: grid; grid-template-columns: 130px 1.4fr 1.4fr 1.2fr 0.8fr; gap: 10px; padding: 10px 16px"><span class="mono" style="color: #5B6372">{{h.at}}</span><span style="font-weight: 500">{{h.action}}</span><span class="muted">{{h.file}}</span><span>{{h.result}}</span><span class="muted">{{h.by}}</span></div></sc-for>
<sc-if value="{{noImpHistory}}" hint-placeholder-val="{{false}}"><div class="muted" style="padding: 16px">No imports yet.</div></sc-if>
</section>
</div>
</sc-if>

<sc-if value="{{v.programs}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{pg.list}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div><h1 class="h1">Programs</h1><div class="muted">Pending until they start, Qualifying from their start date, Approved after 3 consecutive months of active work, then one payment in the following month’s payout. Open a program to see its details and change settings.</div></div>
<sc-if value="{{pg.canDraft}}" hint-placeholder-val="{{true}}"><button class="btnp" onClick="{{pg.toggleNew}}">+ New draft program</button></sc-if>
</div>
<sc-if value="{{pg.newOpen}}" hint-placeholder-val="{{false}}">
<section class="card" style="display: flex; flex-direction: column; gap: 12px; border-color: #D8C9EF; background: #F8F4FD">
<div><h2 class="h2">New draft program</h2><div class="muted">Drafts are invisible to members and have no working links until you launch them. Region, type and currency can’t change after the draft is created.</div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<label class="lbl">Program name<input class="inp" value="{{nd.name}}" onChange="{{pg.setNdName}}" placeholder="e.g. Talent Referral – Colombia"></label>
<div class="lbl">Type<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{pg.ndKinds}}" as="c" hint-placeholder-count="2"><button onClick="{{c.pick}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.bd}}">{{c.label}}</button></sc-for></div></div>
<div class="lbl">Region<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{pg.ndRegions}}" as="c" hint-placeholder-count="3"><button onClick="{{c.pick}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.bd}}">{{c.label}}</button></sc-for></div></div>
<div class="lbl">Payout currency<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{pg.ndCurs}}" as="c" hint-placeholder-count="2"><button onClick="{{c.pick}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.bd}}">{{c.label}}</button></sc-for></div></div>
<div class="lbl" style="grid-column: 1 / -1">Start from<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{pg.ndFroms}}" as="c" hint-placeholder-count="4"><button onClick="{{c.pick}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.bd}}">{{c.label}}</button></sc-for></div></div>
</div>
<sc-if value="{{pg.ndErr}}" hint-placeholder-val="{{false}}"><div style="color: #9A3412; font-size: 13px">{{pg.ndErr}}</div></sc-if>
<div style="display: flex; gap: 8px"><button class="btnp" onClick="{{pg.createDraft}}">Create draft</button><button class="btn" onClick="{{pg.toggleNew}}">Cancel</button></div>
</section>
</sc-if>
<sc-if value="{{pg.hasDrafts}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 class="h2">Drafts <span class="muted" style="font-weight: 400">· not visible to members</span></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<sc-for list="{{pg.drafts}}" as="p" hint-placeholder-count="1">
<section class="card" style="display: flex; flex-direction: column; gap: 10px; border-style: dashed; border-color: #8A93A3">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px"><span><span style="font-weight: 600; font-size: 16px">{{p.name}}</span><br><span class="muted">{{p.kind}} · {{p.region}} · {{p.id}}</span></span><span class="pill" style="background: #EEF0F3; color: #3D4452">Draft</span></div>
<div style="font-size: 13px">{{p.pay}}</div>
<div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; font-size: 12px"><span class="muted">Launch checklist</span><span>{{p.done}} of {{p.total}}</span></div><div class="bar"><div style="height: 8px; background: #4B1C8A; width: {{p.w}}"></div></div></div>
<div class="muted" style="font-size: 12px">Created {{p.created}} by {{p.by}}</div>
<div><button class="btnp" onClick="{{p.open}}">Continue setup →</button></div>
</section>
</sc-for>
</div>
<h2 class="h2" style="margin-top: 6px">Live programs</h2>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<sc-for list="{{pg.cards}}" as="p" hint-placeholder-count="4">
<section class="card" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px"><span><span style="font-weight: 600; font-size: 16px">{{p.name}}</span><br><span class="muted">{{p.kind}} · {{p.region}} · {{p.id}}</span></span><span class="pill" style="background: {{p.sbg}}; color: {{p.sfg}}">{{p.status}}</span></div>
<div style="font-size: 13px"><strong>{{p.pay}}</strong> <span class="muted">· after {{p.months}} consecutive months</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center">
<sc-for list="{{p.nums}}" as="x" hint-placeholder-count="4"><div style="background: #F7F8FA; border-radius: 8px; padding: 8px 4px"><div style="font-size: 18px; font-weight: 600">{{x.v}}</div><div class="muted" style="font-size: 11px">{{x.k}}</div></div></sc-for>
</div>
<sc-if value="{{p.warn}}" hint-placeholder-val="{{false}}"><div class="note">{{p.warn}}</div></sc-if>
<div><button class="btnp" onClick="{{p.open}}">Open program →</button></div>
</section>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{pg.detail}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<button class="btn" onClick="{{pg.back}}">← All programs</button>
<div style="flex: 1 1 300px"><div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><h1 class="h1" style="font-size: 24px">{{pd.name}}</h1><span class="pill" style="background: {{pd.sbg}}; color: {{pd.sfg}}">{{pd.status}}</span></div><div class="muted">{{pd.kind}} · {{pd.region}} · {{pd.id}} · paid in {{pd.cur}}</div></div>
<sc-if value="{{pd.isLive}}" hint-placeholder-val="{{true}}"><span style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn" onClick="{{pd.copyLink}}">Copy signup link</button><button class="btn" onClick="{{pd.viewMembers}}">View members</button><sc-if value="{{pd.canDup}}" hint-placeholder-val="{{true}}"><button class="btn" onClick="{{pd.duplicate}}">Duplicate as draft</button></sc-if></span></sc-if>
</div>
<sc-if value="{{pd.isLive}}" hint-placeholder-val="{{true}}"><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px">
<sc-for list="{{pd.stats}}" as="x" hint-placeholder-count="8"><div class="card" style="padding: 12px 14px"><div class="muted">{{x.k}}</div><div style="font-size: 20px; font-weight: 600; font-family: Inter, sans-serif">{{x.v}}</div></div></sc-for>
</div></sc-if>
<sc-if value="{{pd.isDraft}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="note" style="background: #F7F8FA; border-color: #C9CED6; color: #3D4452"><strong>Draft.</strong> Members can’t see this program and its link doesn’t work yet. While it’s a draft, edits save straight away. After launch, changes need a review, a reason and confirmation.</div>
<section class="card" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><h2 class="h2">Launch checklist</h2><span class="muted">{{pd.ckDone}} of {{pd.ckTotal}} done</span></div>
<sc-for list="{{pd.checklist}}" as="c" hint-placeholder-count="5"><div style="display: flex; gap: 10px; align-items: center; font-size: 13px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #FFFFFF; background: {{c.bg}}">{{c.icon}}</span><span>{{c.text}}</span></div></sc-for>
<sc-if value="{{pd.launchIdle}}" hint-placeholder-val="{{true}}"><div style="display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px"><button class="btnp" onClick="{{pd.startLaunch}}" disabled="{{pd.cantStartLaunch}}">Launch program…</button><button class="btnd" onClick="{{pd.startDelete}}">Delete draft…</button></div></sc-if>
<sc-if value="{{pd.launching}}" hint-placeholder-val="{{false}}">
<div style="background: #F8F4FD; border: 1px solid #D8C9EF; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
<strong>Launch {{pd.name}}</strong>
<sc-for list="{{pd.launchEffects}}" as="e" hint-placeholder-count="3"><div style="display: flex; gap: 8px"><span aria-hidden="true">•</span><span>{{e}}</span></div></sc-for>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px">
<label class="lbl">Reason (15+ characters)<input class="inp" value="{{ps.reason}}" onChange="{{setPsReason}}"></label>
<label class="lbl">Type <span class="mono">{{pd.id}}</span> to confirm<input class="inp mono" value="{{ps.confirm}}" onChange="{{setPsConfirm}}" autocomplete="off"></label>
</div>
<div style="display: flex; gap: 8px"><button class="btnp" onClick="{{pd.confirmLaunch}}" disabled="{{pd.cantStatus}}">Confirm launch</button><button class="btn" onClick="{{pd.cancelStatus}}">Cancel</button></div>
</div>
</sc-if>
<sc-if value="{{pd.deleting}}" hint-placeholder-val="{{false}}">
<div style="background: #FFF7ED; border: 1px solid #F5C9A8; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
<strong>Delete draft {{pd.name}}?</strong><span>The draft and its settings are removed. This can’t be undone; the deletion is kept in the audit log.</span>
<label class="lbl" style="max-width: 260px">Type <span class="mono">{{pd.id}}</span> to confirm<input class="inp mono" value="{{ps.confirm}}" onChange="{{setPsConfirm}}" autocomplete="off"></label>
<div style="display: flex; gap: 8px"><button class="btnd" onClick="{{pd.confirmDelete}}" disabled="{{pd.cantDelete}}">Delete draft</button><button class="btn" onClick="{{pd.cancelStatus}}">Cancel</button></div>
</div>
</sc-if>
</section>
</div>
</sc-if>
<sc-if value="{{pd.warn}}" hint-placeholder-val="{{false}}"><div class="note">{{pd.warn}}</div></sc-if>
<sc-if value="{{pd.readOnly}}" hint-placeholder-val="{{false}}"><div class="muted">You can view this program. Only super admins can change its settings.</div></sc-if>

<sc-for list="{{pd.sections}}" as="sec" hint-placeholder-count="4">
<section class="card" style="padding: 0; overflow: hidden">
<button onClick="{{sec.toggle}}" aria-expanded="{{sec.expStr}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border: 0; background: #FFFFFF; cursor: pointer; text-align: left">
<span><span style="font-weight: 600; font-size: 15px">{{sec.title}}</span><br><span class="muted">{{sec.summary}}</span></span>
<span aria-hidden="true" style="font-size: 18px; color: #5B6372; transform: rotate({{sec.rot}}); display: inline-block">›</span>
</button>
<sc-if value="{{sec.open}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #EEF0F3; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{sec.viewing}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #F1F2F5; font-size: 13px"><span>{{r.label}}</span><strong style="color: {{r.color}}">{{r.value}}</strong></div></sc-for>
<sc-if value="{{sec.canEdit}}" hint-placeholder-val="{{true}}"><div style="padding-top: 10px"><button class="btn" onClick="{{sec.startEdit}}">Edit {{sec.lower}}…</button></div></sc-if>
</div>
</sc-if>
<sc-if value="{{sec.editing}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<div class="muted" style="font-size: 12px">{{sec.stepNote}}</div>
<sc-for list="{{sec.inputs}}" as="f" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #F1F2F5; font-size: 13px; flex-wrap: wrap">
<span style="flex: 1 1 240px">{{f.label}}<sc-if value="{{f.changed}}" hint-placeholder-val="{{false}}"> <span class="pill" style="background: #FEF3C7; color: #854D0E">changed</span></sc-if></span>
<sc-if value="{{f.isText}}" hint-placeholder-val="{{false}}"><input class="inp" value="{{f.value}}" onChange="{{f.setText}}" aria-label="{{f.label}}" style="flex: 1 1 260px"></sc-if>
<sc-if value="{{f.isNum}}" hint-placeholder-val="{{true}}"><span style="display: flex; align-items: center; gap: 6px"><span class="muted">{{f.unit}}</span><input class="inp" type="number" value="{{f.value}}" onChange="{{f.setNum}}" aria-label="{{f.label}}" style="width: 110px"></span></sc-if>
<sc-if value="{{f.isBool}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 8px"><span class="muted">{{f.boolLabel}}</span><button class="tgl" aria-pressed="{{f.tg.pressed}}" aria-label="{{f.label}}" onClick="{{f.tg.flip}}" style="background: {{f.tg.bg}}"><span class="knob" style="margin-left: {{f.tg.ml}}"></span></button></span></sc-if>
<sc-if value="{{f.isChoice}}" hint-placeholder-val="{{false}}"><span style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{f.choices}}" as="c" hint-placeholder-count="2"><button onClick="{{c.pick}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 12px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.bd}}">{{c.label}}</button></sc-for></span></sc-if>
</div>
</sc-for>
<div style="display: flex; gap: 8px; padding-top: 10px"><button class="btnp" onClick="{{sec.review}}" disabled="{{sec.noChanges}}">{{sec.reviewLabel}}</button><button class="btn" onClick="{{sec.cancel}}">Cancel</button></div>
</div>
</sc-if>
<sc-if value="{{sec.reviewing}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="muted" style="font-size: 12px">Step 2 of 2 · confirm</div>
<div style="background: #FFF7ED; border: 1px solid #F5C9A8; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<sc-for list="{{sec.diffs}}" as="d" hint-placeholder-count="2"><div><strong>{{d.label}}:</strong> <span style="text-decoration: line-through; color: #5B6372">{{d.from}}</span> → <strong>{{d.to}}</strong></div></sc-for>
<div class="muted" style="font-size: 12px">{{sec.impact}}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px">
<label class="lbl">Reason (15+ characters, saved to the change history)<input class="inp" value="{{pe.reason}}" onChange="{{setPeReason}}"></label>
<label class="lbl">Type <span class="mono">{{pd.id}}</span> to confirm<input class="inp mono" value="{{pe.confirm}}" onChange="{{setPeConfirm}}" autocomplete="off"></label>
</div>
<div style="display: flex; gap: 8px"><button class="btnp" onClick="{{sec.save}}" disabled="{{sec.cantSave}}">Save changes</button><button class="btn" onClick="{{sec.backToEdit}}">Back</button></div>
</div>
</sc-if>
</div>
</sc-if>
</section>
</sc-for>

<sc-if value="{{pd.isLive}}" hint-placeholder-val="{{true}}">
<section class="card" style="padding: 0; overflow: hidden; border-color: #F0C3B0">
<button onClick="{{pd.toggleStatus}}" aria-expanded="{{pd.statusExpStr}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border: 0; background: #FFFFFF; cursor: pointer; text-align: left">
<span><span style="font-weight: 600; font-size: 15px; color: #9A3412">Program status</span><br><span class="muted">Currently {{pd.status}} · pause or resume the whole program</span></span>
<span aria-hidden="true" style="font-size: 18px; color: #5B6372; transform: rotate({{pd.statusRot}}); display: inline-block">›</span>
</button>
<sc-if value="{{pd.statusOpen}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #F5D9CC; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
<div>{{pd.statusExplain}}</div>
<sc-if value="{{pd.canStatus}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{pd.statusIdle}}" hint-placeholder-val="{{true}}"><div><button class="btnd" onClick="{{pd.startStatus}}">{{pd.statusAction}}…</button></div></sc-if>
<sc-if value="{{pd.statusConfirming}}" hint-placeholder-val="{{false}}">
<div style="background: #FFF7ED; border: 1px solid #F5C9A8; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<strong>{{pd.statusAction}}: {{pd.name}}</strong>
<sc-for list="{{pd.statusEffects}}" as="e" hint-placeholder-count="3"><div style="display: flex; gap: 8px"><span aria-hidden="true">•</span><span>{{e}}</span></div></sc-for>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px">
<label class="lbl">Reason (15+ characters)<input class="inp" value="{{ps.reason}}" onChange="{{setPsReason}}"></label>
<label class="lbl">Type <span class="mono">{{pd.id}}</span> to confirm<input class="inp mono" value="{{ps.confirm}}" onChange="{{setPsConfirm}}" autocomplete="off"></label>
</div>
<div style="display: flex; gap: 8px"><button class="btnd" onClick="{{pd.confirmStatus}}" disabled="{{pd.cantStatus}}">Confirm: {{pd.statusAction}}</button><button class="btn" onClick="{{pd.cancelStatus}}">Cancel</button></div>
</div>
</sc-if>
</div>
</sc-if>
</div>
</sc-if>
</section>
</sc-if>

<section class="card" style="padding: 0; overflow: hidden">
<button onClick="{{pd.toggleHist}}" aria-expanded="{{pd.histExpStr}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border: 0; background: #FFFFFF; cursor: pointer; text-align: left">
<span><span style="font-weight: 600; font-size: 15px">Change history</span><br><span class="muted">{{pd.histCount}} changes · last {{pd.lastChange}}</span></span>
<span aria-hidden="true" style="font-size: 18px; color: #5B6372; transform: rotate({{pd.histRot}}); display: inline-block">›</span>
</button>
<sc-if value="{{pd.histOpen}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #EEF0F3; padding: 4px 18px 12px">
<sc-for list="{{pd.history}}" as="h" hint-placeholder-count="3"><div style="display: grid; grid-template-columns: 120px 90px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid #F1F2F5; font-size: 13px"><span class="mono" style="color: #5B6372">{{h.at}}</span><strong>{{h.by}}</strong><span>{{h.text}}<br><span class="muted">“{{h.reason}}”</span></span></div></sc-for>
</div>
</sc-if>
</section>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{v.reports}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap"><div><h1 class="h1">Reports</h1><div class="muted">{{regionLabel}}</div></div><button class="btnp" onClick="{{exportAll}}">Export referrals CSV</button></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px">
<sc-for list="{{funnels}}" as="f" hint-placeholder-count="2">
<section class="card"><h2 class="h2" style="margin-bottom: 10px">{{f.title}}</h2>
<sc-for list="{{f.rows}}" as="x" hint-placeholder-count="5"><div style="display: grid; grid-template-columns: 140px minmax(0, 1fr) 40px; gap: 8px; align-items: center; padding: 4px 0"><span style="font-size: 13px">{{x.label}}</span><div style="background: #EEF0F3; border-radius: 6px; height: 18px"><div style="height: 18px; border-radius: 6px; background: #4B1C8A; width: {{x.w}}"></div></div><strong style="text-align: right">{{x.n}}</strong></div></sc-for>
</section>
</sc-for>
</div>
<section class="card"><h2 class="h2" style="margin-bottom: 8px">Monthly payouts</h2>
<sc-for list="{{monthly}}" as="m" hint-placeholder-count="3"><div class="tr" style="display: flex; justify-content: space-between"><span>{{m.month}}</span><span>{{m.n}} payments · {{m.total}}</span></div></sc-for>
<sc-if value="{{noMonthly}}" hint-placeholder-val="{{true}}"><div class="muted">No payouts released yet. Move the demo date forward and release a batch.</div></sc-if>
</section>
</div>
</sc-if>

<sc-if value="{{v.settings}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<h1 class="h1">Settings</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start">
<section class="card" style="display: flex; flex-direction: column; gap: 8px">
<h2 class="h2">Team &amp; regions</h2>
<sc-for list="{{team}}" as="t" hint-placeholder-count="3"><div class="tr" style="display: grid; grid-template-columns: 1.3fr 1.2fr 1fr; gap: 8px"><span style="font-weight: 500">{{t.name}}</span><span>{{t.role}}</span><span class="muted">{{t.regions}}</span></div></sc-for>
<div class="muted">Region admins see and act only on their regions, including search and exports. Payout approvers release batches and are read-only elsewhere.</div>
</section>
<section class="card" style="display: flex; flex-direction: column; gap: 8px">
<h2 class="h2">Radius &amp; CRM sync</h2>
<div style="font-size: 13px">Talent journey and engagement events from Radius; customer deal stages and go-live from the CRM. Events are de-duplicated by ID, so replays are ignored.</div>
<div style="padding-top: 6px"><button class="btn demo" onClick="{{replay}}">Replay last webhook</button></div>
</section>
<section class="card" style="display: flex; flex-direction: column; gap: 8px">
<h2 class="h2">Audit log</h2>
<sc-for list="{{auditRows}}" as="a" hint-placeholder-count="6"><div style="display: grid; grid-template-columns: 110px 120px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid #EEF0F3; font-size: 12px"><span class="mono" style="color: #5B6372">{{a.at}}</span><span style="font-weight: 500">{{a.actor}}</span><span>{{a.text}}</span></div></sc-for>
</section>
</div>
</div>
</sc-if>

</main>
</div>

<sc-if value="{{drawerOpen}}" hint-placeholder-val="{{false}}">

<button onClick="{{closeDrawer}}" aria-label="Close window" title="Click outside to close" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(20,23,31,.5); cursor: pointer"></button>
<section role="dialog" aria-modal="true" aria-label="{{drawerTitle}}" style="position: relative; width: 1000px; max-width: 100%; max-height: 100%; overflow: hidden; background: #FFFFFF; border-radius: 16px; box-shadow: 0 24px 64px rgba(20,23,31,.35); display: flex; flex-direction: column">
<div class="mscroll" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column">

<sc-if value="{{dm.has}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #E3E6EB; position: sticky; top: 0; background: #FFFFFF; z-index: 1">
<sc-if value="{{canBack}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{drawerBack}}" aria-label="Back" style="min-height: 32px">←</button></sc-if>

<div style="flex: 1 1 220px; min-width: 0"><div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-size: 18px; font-weight: 600">{{dm.name}}</span><button class="cp" onClick="{{dm.copyName}}" aria-label="Copy name" title="Copy name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button><span class="pill" style="background: {{dm.bg}}; color: {{dm.fg}}">{{dm.status}}</span></div><div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13px"><span style="font-weight: 500">{{dm.email}}</span><button class="cp" onClick="{{dm.copyEmail}}" aria-label="Copy email" title="Copy email"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button><span class="muted">· {{dm.progLine}} · {{dm.lastActive}}</span></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center"><button class="btn" onClick="{{dm.copyLink}}">Copy share link</button>
<div style="position: relative"><button class="btn" onClick="{{dm.toggleMenu}}" aria-expanded="{{dm.menuOpenStr}}" style="font-weight: 600">Actions ▾</button>
<sc-if value="{{dm.menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; right: 0; top: 42px; z-index: 5; width: 280px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; box-shadow: 0 12px 32px rgba(20,23,31,.18); padding: 6px">
<sc-for list="{{dm.menu}}" as="a" hint-placeholder-count="3">
<div style="border-radius: 8px">
<button role="menuitem" onClick="{{a.go}}" style="width: 100%; text-align: left; padding: 10px; border: 0; border-radius: 8px; background: {{a.bg}}; cursor: pointer; color: {{a.fg}}"><div style="font-weight: 600; font-size: 13px">{{a.label}}</div><div class="muted" style="font-size: 12px">{{a.sub}}</div></button>
<sc-if value="{{a.confirming}}" hint-placeholder-val="{{false}}"><div style="display: flex; gap: 6px; padding: 4px 10px 10px"><button class="btnd" onClick="{{a.confirm}}" style="min-height: 32px">{{a.confirmLabel}}</button><button class="btn" onClick="{{a.cancel}}" style="min-height: 32px">Cancel</button></div></sc-if>
</div>
</sc-for>
</div>
</sc-if>
</div></div>
<button class="btn" onClick="{{closeDrawer}}" aria-label="Close window" style="min-height: 34px; font-weight: 600">Close ✕</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #E3E6EB">
<sc-for list="{{dm.stats}}" as="x" hint-placeholder-count="4"><div style="padding: 10px 20px; border-right: 1px solid #EEF0F3"><div style="font-size: 18px; font-weight: 600">{{x.v}}</div><div class="muted">{{x.k}}</div></div></sc-for>
</div>
