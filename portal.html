<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Talent Referral portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-lite.js" defer></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="dc-template">
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B1C8A}a:hover{color:#35106A}
input,select,button,textarea{font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #4B1C8A;outline-offset:2px}
button,.card,.tr,.pill,.inp,.ta,.tab{transition:background-color .18s ease,border-color .18s ease,box-shadow .2s ease,transform .15s ease,color .18s ease,filter .15s ease}
button:not(:disabled):hover{filter:brightness(.97)}
.btn:not(:disabled):hover{border-color:#B9A3DE;color:#35106A}
.btnp:not(:disabled):hover{filter:none;background:#35106A;box-shadow:0 4px 14px rgba(75,28,138,.30);transform:translateY(-1px)}
.btnd:not(:disabled):hover{border-color:#D97757;box-shadow:0 2px 8px rgba(180,35,24,.12)}
button:not(:disabled):active{transform:translateY(0) scale(.97)}
.inp:hover,.ta:hover{border-color:#B9A3DE}
.inp:focus,.ta:focus{border-color:#4B1C8A;box-shadow:0 0 0 3px rgba(75,28,138,.14);outline:none}
.tr:hover{box-shadow:inset 3px 0 0 #4B1C8A}
.tab:hover{color:#4B1C8A !important}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
button.card:hover,.lift:hover{box-shadow:0 8px 22px rgba(75,28,138,.13);transform:translateY(-2px);border-color:#D8C9EF}
.bar>div,.bar>span{transform-origin:left center;animation:barGrow .9s cubic-bezier(.2,.8,.2,1) both}
.ovl{animation:fadeIn .18s ease both}
[role=dialog]{animation:popIn .24s cubic-bezier(.2,.8,.2,1) both}
[role=status]{animation:slideDown .28s cubic-bezier(.2,.8,.2,1) both}
[role=menu]{animation:slideDown .16s ease both}
.pill{animation:fadeIn .3s ease both}
.cp:active{transform:scale(.9)}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.demo{position:relative;outline:2px dashed #B7791F !important;outline-offset:3px;border-radius:8px}
.demo::after{content:'DEMO ONLY';position:absolute;top:-11px;right:8px;font:700 9px/1.5 Inter,sans-serif;letter-spacing:.08em;background:#B7791F;color:#FFFFFF;padding:0 6px;border-radius:4px;pointer-events:none;z-index:3;white-space:nowrap}
.demo-in{outline-offset:-4px}
.demo-in::after{top:4px}

@media (max-width: 640px){
.pnav{flex-wrap:nowrap !important;overflow-x:auto;width:100%;order:3;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.pnav::-webkit-scrollbar{display:none}
.pnav button{flex:none}
.phdr{padding:10px 14px !important;gap:8px !important}
.pwrap{padding:16px 14px 40px !important;gap:14px !important}
.band{grid-template-columns:repeat(2,minmax(0,1fr)) !important;padding:10px !important}
.band>div>div:nth-child(2){font-size:24px !important}
.linkbox{padding:14px !important}
.linkbox .mono{font-size:15px !important}
.linkbox .btnp{width:100%}
.card{padding:14px !important}
.hero-h1{font-size:28px !important}
.hero-p{font-size:15px !important}
.pwrap .ta{min-height:90px}
.dbar{gap:6px !important;padding:8px 10px !important}
.dbar .dtxt{display:none}
.dbar button{min-height:34px !important;padding:0 10px !important;font-size:12px !important}
.emailhdr{grid-template-columns:56px minmax(0,1fr) !important}
.rowgrid{grid-template-columns:minmax(0,1fr) auto !important}
}
.vsw{display:inline-flex;gap:2px;padding:3px;background:#2A2F3A;border-radius:10px}
.vsw a,.vsw span{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;text-decoration:none;color:#C9CFDA;white-space:nowrap}
.vsw a:hover{background:#3A4050;color:#FFFFFF}
.vsw .on{background:#FFFFFF;color:#14171F}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

.stag>*{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}.stag>*:nth-child(7){animation-delay:.24s}.stag>*:nth-child(8){animation-delay:.28s}
.rowbtn:hover{background:#F8F4FD !important}
.band>div{border-radius:8px;padding:8px 12px;transition:background-color .2s ease,transform .2s ease}
.band>div:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.navtab:hover{background:#F3EEFA !important}
.linkbox{animation:fadeUp .45s ease both}
.copied{animation:pulse .6s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(75,28,138,.45)}100%{box-shadow:0 0 0 14px rgba(75,28,138,0)}}

button:disabled{opacity:.45;cursor:not-allowed}
.card{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:20px;box-sizing:border-box;min-width:0}
.btn{min-height:40px;padding:0 14px;border:1px solid #C9CED6;border-radius:8px;background:#FFFFFF;color:#14171F;cursor:pointer;font-size:13px;font-weight:500}
.btnp{min-height:44px;padding:0 18px;border:1px solid #4B1C8A;border-radius:8px;background:#4B1C8A;color:#FFFFFF;cursor:pointer;font-size:14px;font-weight:600}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.inp{min-height:42px;padding:0 12px;border:1px solid #C9CED6;border-radius:8px;background:#FFFFFF;font-size:14px;box-sizing:border-box;width:100%}
.ta{padding:10px 12px;border:1px solid #C9CED6;border-radius:8px;font-size:13px;min-height:110px;resize:vertical;box-sizing:border-box;width:100%}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#3D4452}
.muted{color:#5B6372;font-size:13px}
.h1{margin:0;font-family:Inter,sans-serif;letter-spacing:-0.01em;font-size:28px;font-weight:600}
.h2{margin:0;font-size:16px;font-weight:600}
.mono{font-family:ui-monospace,Menlo,monospace}
.bar{background:#EEF0F3;border-radius:999px;height:8px;overflow:hidden}
.tgl{width:40px;height:24px;border-radius:999px;border:0;padding:2px;cursor:pointer;display:inline-flex;flex:none}
.knob{width:20px;height:20px;border-radius:50%;background:#FFFFFF;display:block;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.note{background:#FFFBEB;border:1px solid #F3D98B;border-radius:10px;padding:10px 14px;font-size:13px;color:#5B4410}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F5F8; font-family: Inter, system-ui, sans-serif; color: #14171F; font-size: 14px; line-height: 1.45">

<div class="demo demo-in dbar" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; background: #14171F">
<nav class="vsw" aria-label="Prototype view"><a href="Main.dc.html">Admin</a><span class="on" aria-current="page">Member</span></nav><span style="width: 1px; height: 22px; background: #3A4050; margin: 0 4px"></span><span class="dtxt" style="font-size: 12px; color: #B8BFCC; margin-right: 4px">Demo date Nov 20, 2026 · view as</span>
<sc-for list="{{personas}}" as="p" hint-placeholder-count="2"><button onClick="{{p.pick}}" style="min-height: 36px; padding: 0 14px; border: 0; border-radius: 8px; cursor: pointer; font-size: 13px; background: {{p.bg}}; color: {{p.fg}}; font-weight: {{p.fw}}">{{p.label}}</button></sc-for>
</div>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="max-width: 1180px; margin: 12px auto 0; padding: 0 24px; box-sizing: border-box"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #14171F; color: #FFFFFF; border-radius: 10px; padding: 8px 8px 8px 16px; font-size: 13px"><span>{{toast}}</span><button onClick="{{clearToast}}" aria-label="Dismiss" style="background: transparent; color: #FFFFFF; border: 0; min-height: 32px; padding: 0 10px; cursor: pointer">✕</button></div></div>
</sc-if>

<sc-if value="{{isMember}}" hint-placeholder-val="{{true}}">
<div>
<header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
<div class="phdr" style="max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 10px"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><g fill="#4B1C8A"><circle cx="4" cy="4" r="3.2"></circle><circle cx="12" cy="4" r="3.2"></circle><rect x="17" y="1" width="12" height="6" rx="3"></rect><circle cx="4" cy="11" r="3.2"></circle><rect x="9" y="8" width="12" height="6" rx="3"></rect><circle cx="4" cy="18" r="3.2"></circle><circle cx="12" cy="18" r="3.2"></circle><rect x="17" y="15" width="12" height="6" rx="3"></rect></g></svg><div><div style="font-weight: 700; color: #2B0D57; letter-spacing: -0.01em">{{t.brand}}</div><div class="muted" style="font-size: 12px">{{me.name}} · {{me.country}} · paid in {{me.cur}}</div></div></div>
<nav class="pnav" aria-label="Portal" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{tabs}}" as="x" hint-placeholder-count="5"><button class="navtab" onClick="{{x.pick}}" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; cursor: pointer; font-size: 14px; background: {{x.bg}}; color: {{x.fg}}; font-weight: {{x.fw}}">{{x.label}}</button></sc-for>
</nav>
<button class="btn" onClick="{{toggleLang}}" aria-label="Switch language" style="min-height: 34px">{{langLabel}}</button>
</div>
</header>

<div class="pwrap" style="max-width: 1180px; margin: 0 auto; padding: 24px 24px 56px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">

<sc-if value="{{tab.home}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div class="band stag" style="background: #4B1C8A; border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; color: #FFFFFF; box-shadow: 0 10px 30px rgba(75,28,138,.22)">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4"><div><div style="font-size: 13px; font-weight: 600; color: #EADFFB">{{s.label}}</div><div style="font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em">{{s.value}}</div><div style="font-size: 12px; color: #CDBBEC">{{s.sub}}</div></div></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section class="card stag" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px"><h2 class="h2">Your referrals</h2><button onClick="{{goRefs}}" style="background: transparent; border: 0; color: #4B1C8A; cursor: pointer; font-weight: 500; font-size: 13px; padding: 0">View all</button></div>
<sc-for list="{{glance}}" as="g" hint-placeholder-count="5">
<button class="rowbtn" onClick="{{g.open}}" style="width: 100%; text-align: left; border: 0; border-top: 1px solid #EEF0F3; background: #FFFFFF; cursor: pointer; padding: 9px 0; display: flex; flex-direction: column; gap: 5px">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px"><span><strong>{{g.name}}</strong> <span class="muted" style="font-size: 12px">· {{g.step}}</span></span><span class="pill" style="background: {{g.bg}}; color: {{g.fg}}">{{g.status}}</span></span>
<sc-if value="{{g.hasMeter}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 8px"><span class="bar" style="flex: 1"><span style="display: block; height: 8px; background: {{g.color}}; width: {{g.w}}"></span></span><span class="muted" style="font-size: 12px; flex: none">{{g.meter}}</span></span></sc-if>
</button>
</sc-for>
<div class="muted" style="font-size: 12px; border-top: 1px solid #EEF0F3; padding-top: 8px">{{t.bonusLabel}}: <strong style="color: #14171F">{{me.payLine}}</strong>, after 3 consecutive months of active work</div>
</section>
<section class="card" style="flex: 1.3 1 420px; display: flex; flex-direction: column; gap: 14px">
<h2 class="h2" style="font-size: 18px">{{t.share}}</h2>
<div class="linkbox" style="background: #F6F1FC; border: 2px solid #4B1C8A; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 700; color: #4B1C8A; text-transform: uppercase; letter-spacing: 0.06em">Your unique referral link</div>
<div class="mono" style="font-size: 20px; font-weight: 600; color: #14171F; overflow-wrap: anywhere; line-height: 1.3">{{link}}</div>
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><button class="btnp {{copyCls}}" onClick="{{copy}}" style="min-height: 48px; padding: 0 24px; font-size: 15px">{{copyLabel}}</button><span class="muted">Candidates must apply through this link for the referral to count.</span></div>
</div>
<div style="border-top: 1px solid #EEF0F3; padding-top: 14px; display: flex; flex-direction: column; gap: 10px">
<h2 class="h2">{{t.invite}}</h2>
<label class="lbl">{{t.friendEmail}}<input class="inp" value="{{inv.email}}" onChange="{{setInvEmail}}" placeholder="name@email.com"></label>
<label class="lbl">{{t.message}}<textarea class="ta" value="{{inv.msg}}" onChange="{{setInvMsg}}"></textarea></label>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; cursor: pointer"><input type="checkbox" checked="{{inv.consent}}" onChange="{{flipConsent}}" style="width: 18px; height: 18px; margin-top: 2px"><span>{{t.consent}}</span></label>
<sc-if value="{{invErr}}" hint-placeholder-val="{{false}}"><div style="background: #FCE7DE; color: #9A3412; border-radius: 8px; padding: 10px 12px; font-size: 13px">{{invErr}}</div></sc-if>
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><button class="btnp" onClick="{{sendInvite}}">{{t.send}}</button><button class="btn" onClick="{{togglePreview}}" aria-expanded="{{previewOpenStr}}">{{previewLabel}}</button><span class="muted" style="font-size: 12px">{{t.inviteNote}}</span></div>
<sc-if value="{{previewOpen}}" hint-placeholder-val="{{false}}">
<div aria-label="Invitation email preview" style="border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden; background: #F4F5F8">
<div class="emailhdr" style="background: #FFFFFF; padding: 10px 14px; border-bottom: 1px solid #E3E6EB; font-size: 12px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 3px 8px">
<span class="muted" style="font-size: 12px">From</span><span>Edge Talent Network &lt;referrals@onedge.co&gt;</span>
<span class="muted" style="font-size: 12px">Reply-to</span><span>{{me.name}} &lt;{{me.email}}&gt;</span>
<span class="muted" style="font-size: 12px">To</span><span>{{pv.to}}</span>
<span class="muted" style="font-size: 12px">Subject</span><strong>{{pv.subject}}</strong>
</div>
<div style="padding: 18px">
<div style="max-width: 520px; margin: 0 auto; background: #FFFFFF; border-radius: 12px; overflow: hidden; border: 1px solid #E3E6EB">
<div style="background: #4B1C8A; padding: 14px 20px; display: flex; align-items: center; gap: 8px"><span style="width: 26px; height: 26px; border-radius: 6px; background: #4B1C8A; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Space Grotesk', sans-serif">E</span><span style="color: #FFFFFF; font-weight: 600">Edge Talent Network</span></div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px">
<div style="font-family: Inter, sans-serif; letter-spacing: -0.01em; font-size: 20px; font-weight: 600; line-height: 1.25">{{me.name}} thinks you’d be a great fit at Edge</div>
<div style="background: #F7F8FA; border-left: 3px solid #4B1C8A; border-radius: 6px; padding: 12px 14px; white-space: pre-line">{{pv.msg}}</div>
<div class="muted" style="font-size: 12px">Personal message from {{me.first}}, a member of Edge’s Talent Network</div>
<div>Edge connects experienced professionals with remote roles in <strong>Healthcare, Insurance and Accounting</strong>. Ideal candidates have 2–3+ years of relevant experience.</div>
<div style="text-align: center; padding: 4px 0"><span style="display: inline-block; background: #4B1C8A; color: #FFFFFF; font-weight: 600; padding: 12px 22px; border-radius: 8px">Apply with {{me.first}}’s referral</span><div class="mono" style="font-size: 11px; color: #5B6372; margin-top: 6px">{{pv.link}}</div></div>
<div style="font-size: 13px"><strong>Your application will need:</strong> a Radius profile with photo, intro video, background and skills, plus an assessment and AI interview. Complete applications are reviewed in about 30 days.</div>
<div style="font-size: 12px; color: #5B6372; border-top: 1px solid #EEF0F3; padding-top: 12px">Apply using the button above so your application is linked to {{me.first}}. Please use one email address and apply only once. You’re receiving this one-time email because {{me.first}} entered your address and confirmed you agreed to be contacted; we won’t email you again unless you apply. <span style="text-decoration: underline">Don’t contact me again</span></div>
</div>
</div>
</div>
</div>
</sc-if>
<sc-for list="{{invites}}" as="i" hint-placeholder-count="1"><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-top: 1px solid #F1F2F5"><span>{{i.email}}</span><span class="muted">{{i.state}}</span></div></sc-for>
</div>
</section>
</div>
</div>
</sc-if>

<sc-if value="{{tab.refs}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section class="card stag" style="flex: 1.3 1 440px; padding: 8px 16px">
<sc-for list="{{refRows}}" as="r" hint-placeholder-count="6">
<button class="rowbtn" onClick="{{r.pick}}" style="width: 100%; display: grid; grid-template-columns: minmax(0, 1.4fr) auto; gap: 12px; align-items: center; padding: 12px 8px; border: 0; border-bottom: 1px solid #EEF0F3; cursor: pointer; text-align: left; border-radius: 6px; background: {{r.rowBg}}">
<span><span style="font-weight: 500">{{r.name}}</span><br><span class="muted">{{r.step}} · {{r.bonus}}</span></span>
<span class="pill" style="background: {{r.bg}}; color: {{r.fg}}">{{r.status}}</span>
</button>
</sc-for>
<div class="muted" style="padding: 12px 8px; font-size: 12px">{{t.missing}}</div>
</section>
<section class="card" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 14px">
<div><h2 class="h2" style="font-size: 18px">{{sel.name}}</h2><div class="muted">{{t.appliedOn}} {{sel.applied}}</div></div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6"><li style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{s.dbg}}; color: {{s.dfg}}; border: 1.5px solid {{s.dbd}}">{{s.n}}</span><span style="font-weight: {{s.fw}}; color: {{s.color}}">{{s.label}}</span></li></sc-for>
</ol>
<div style="border-top: 1px solid #EEF0F3; padding-top: 12px; display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 600; font-size: 13px">{{t.bonusTracker}}</div>
<div class="bar"><div style="height: 8px; background: {{sel.barColor}}; width: {{sel.w}}"></div></div>
<div style="font-size: 13px">{{sel.bonusText}}</div>
</div>
<sc-if value="{{sel.hint}}" hint-placeholder-val="{{false}}"><div class="note">{{sel.hint}}</div></sc-if>
</section>
</div>
</sc-if>

<sc-if value="{{tab.client}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section class="card" style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px">
<h1 class="h1" style="font-size: 22px">Refer a client to Edge</h1>
<p class="muted" style="margin: 0">Know a company that needs remote talent in healthcare, insurance or accounting? Introduce them. Once they become a customer, the referral is Qualifying from their start date; after 3 consecutive active months it is approved and paid in the following month’s payout.</p>
<label class="lbl">Company name<input class="inp" value="{{cl.company}}" onChange="{{setClCompany}}"></label>
<label class="lbl">Company website<input class="inp" value="{{cl.domain}}" onChange="{{setClDomain}}" placeholder="company.com"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label class="lbl">Contact name<input class="inp" value="{{cl.contact}}" onChange="{{setClContact}}"></label><label class="lbl">Contact email<input class="inp" value="{{cl.email}}" onChange="{{setClEmail}}"></label></div>
<label class="lbl">How do you know them? What do they need?<textarea class="ta" value="{{cl.note}}" onChange="{{setClNote}}" style="min-height: 70px"></textarea></label>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; cursor: pointer"><input type="checkbox" checked="{{cl.consent}}" onChange="{{flipClConsent}}" style="width: 18px; height: 18px; margin-top: 2px"><span>The contact agreed to be introduced to Edge’s sales team.</span></label>
